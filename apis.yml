aid: blockade-games
name: Blockade Games
description: >-
  Blockade Games (operating as Blockade Labs) is the maker of Skybox AI, an
  AI-powered platform that generates production-ready 360 equirectangular
  panoramas and skyboxes from text prompts, along with depth maps for 3D scenes.
  It offers a public REST API for asynchronous skybox generation, style
  selection, remixing, history, and multi-format exports, with delivery via
  webhooks and Pusher realtime events. First-party SDKs ship for
  JavaScript/TypeScript (npm), PHP/Laravel (Packagist), and Unity (C#), plus
  engine and tool integrations for Blender, Unreal, Godot, Roblox, SketchUp, and
  Figma. The product serves game, VR/AR, film, e-commerce, and education teams.
